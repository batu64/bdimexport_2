# KÖK wrangler.toml — YALNIZ YEREL migration/geliştirme (FAZ_0 0.8: `wrangler d1 migrations apply bdimexport-db --local`).
# DEPLOY İÇİN DEĞİL. Remote ortamların TEK kaynağı workers/api/wrangler.toml ([env.staging] / [env.production]);
# ID'ler iki yerde tutulmasın diye burada staging/production bloğu YOK (FAZ_3 3.9 — docs/deploy.md).
name = "bdimexport"
main = "workers/api/src/index.ts"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "bdimexport-db"
database_id = "local-dev"   # production ID FAZ_3 3.9'da gerçek D1 oluşturulunca girilir (insan)
migrations_dir = "db/migrations"

# R2 — logo/katalog (FAZ_1 1.6'da aktif kullanım)
# credential'lar env: CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN (keys.md → ~/.bdimexport-secrets/)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bdimexport-media"

# KV — cache + rate limit (FAZ_1 1.8)
[[kv_namespaces]]
binding = "CACHE"
id = "local-dev"           # production ID FAZ_3'te girilir

# Cron — FAZ_4'te aktif (rss + TTL)
# [triggers]
# crons = ["0 * * * *", "0 23 * * *"]
