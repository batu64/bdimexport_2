name: Orchestrator Loop
# FAZ_0 Step 0.7 — 15dk döngü (ORCHESTRATION.md §7.1)
# NOT: Bu workflow FAZ_0 0.10 provası başarılı olana kadar workflow_dispatch ile MANUEL çalışır.
# Schedule'ı 0.10 sonrası aç (çıkarı satırı geri getir).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kuyruğu işlemeden raporla"
        type: boolean
        default: true
  # schedule:
  #   - cron: "*/15 * * * *"   # 0.10 provası sonrası aktive edilecek
  repository_dispatch:
    types: [admin-task]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: orchestrator
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Orchestrator döngüsü
        env:
          # ORCHESTRATION.md §7 — secret'lar env referanslı, koda ASLA gömülmez
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GH_ORCHESTRATOR_PAT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "Orchestrator (GLM 5.3) döngüsü — prompts/task-templates.md §Şablon 8"
          echo "TODO(FAZ_0 sonrası): orchestrator CLI kurulumu (her provider SDK'sı) burada çağrılır."
          echo "Bu placeholder 0.10 provasında gerçek CLI ile değiştirilecek."
          node -e "const q=require('./tasks/task_queue.json');console.log('pending görevler:',q.tasks.filter(t=>t.status==='pending').map(t=>t.id).join(', ')||'yok')"
