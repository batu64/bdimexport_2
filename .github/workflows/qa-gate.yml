name: QA Gate
# FAZ_0 Step 0.7 — her PR'da build + gitleaks + workflow lint + D1 şema doğrulaması.
# v2.0: eski task_queue şema kontrolü kaldırıldı (kuyruk/dispatch yok). Secret gömülü değil; yalnızca GITHUB_TOKEN.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qa-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2

  d1-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Migration'lar boş SQLite'a sırayla uygulanır ve beklenen tablolar oluşur
        run: |
          python3 - <<'PY'
          import glob, sqlite3, sys
          required = {"partners", "leads", "contents", "rss_news", "keywords", "ai_jobs", "analytics_daily"}
          db = sqlite3.connect(":memory:")
          files = sorted(glob.glob("db/migrations/*.sql"))
          if not files:
              sys.exit("db/migrations/ is empty")
          for f in files:
              db.executescript(open(f, encoding="utf-8").read())
              print("OK", f)
          tables = {r[0] for r in db.execute("select name from sqlite_master where type='table'")}
          missing = required - tables
          if missing:
              sys.exit("missing tables: " + ", ".join(sorted(missing)))
          print("schema OK -", len(tables), "tables")
          PY
