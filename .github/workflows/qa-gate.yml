name: QA Gate
# FAZ_0 Step 0.7 — her PR'da qa envanteri + gitleaks (ORCHESTRATION.md §7.2)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Schema validasyonu (task kuyruğu)
        run: |
          node -e "
            const q=require('./tasks/task_queue.json');
            if(!Array.isArray(q.tasks)) throw new Error('tasks dizi değil');
            for(const t of q.tasks){
              for(const f of ['id','type','scope','agent','model','acceptance','status'])
                if(t[f]===undefined) throw new Error(t.id+': '+f+' eksik');
              if(!['pending','dispatched','in_review','accepted','failed','blocked','needs_human'].includes(t.status))
                throw new Error(t.id+': geçersiz status '+t.status);
            }
            console.log('task_queue şeması OK —', q.tasks.length, 'görev');
          "
