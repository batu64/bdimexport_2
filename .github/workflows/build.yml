name: Build
# FAZ_0 Step 0.7 — pnpm install + build. qa-gate.yml tarafından çağrılır (workflow_call); elle de çalıştırılabilir.
# v2.0: orchestrator-cron workflow'u YOK (AGENTS.md §7). Secret gerekmez; build static export.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
